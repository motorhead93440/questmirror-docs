<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>QuestMirror Documentation</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 90%;
            text-align: center;
        }
        h1 {
            color: #ffffff;
            margin-bottom: 10px;

        }
        p {
            color: #a0a0a0;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        a {
            display: block;
            background-color: #333333;
            color: #4da6ff;
            text-decoration: none;
            padding: 15px 20px;

            font-weight: 600;

        a:hover {
            background-color: #444444;
            transform: translateY(-2px);
